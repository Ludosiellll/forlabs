name: Windows

on:
  push:
    branches: [main, exe]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  NUITKA_VERSION: "4.3.5"

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 60  # набор растёт: 1.0.19 шёл 39 мин 41 с, 1.0.21 упёрся в прежние 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Зависимости
        run: python -m pip install ".[windows,dev]"
      - name: LibreOffice (предпросмотр страниц, как у студента без Word)
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {  # загрузка с зеркала иногда обрывается
            choco install libreoffice-fresh -y --no-progress
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds (20 * $i)
          }
          exit 1
      - name: Тесты
        shell: pwsh
        run: |
          python -m pytest -q -p no:cacheprovider -rfE --tb=line 2>&1 | Tee-Object -FilePath pytest.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # GitHub показывает не больше 10 аннотаций на шаг — все падения одной аннотацией
            $lines = Get-Content pytest.txt | Select-String -Pattern "^(FAILED|ERROR) |^[A-Z]:\\.*:\d+: " | ForEach-Object { $_.Line }
            Write-Output ("::error title=pytest::" + (($lines | Select-Object -First 120) -join "%0A"))
          }
          exit $code

  programs:
    name: Программы лаб на всех языках
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Зависимости
        run: python -m pip install ".[windows]"
      - name: План → сборка → песочница → сценарий → снимок (C#, C++, Python, Java, JS, PHP, Go, сайты, MySQL)
        shell: pwsh
        run: |
          python tools/ci_lab_programs.py
          $code = $LASTEXITCODE
          if (Test-Path build/probe/report.json) {
            $r = Get-Content build/probe/report.json -Raw -Encoding utf8 | ConvertFrom-Json
            $bad = $r.cases.PSObject.Properties | Where-Object { -not $_.Value.ok } | ForEach-Object { "$($_.Name): $($_.Value.reason)$($_.Value.error)" }
            if ($bad) { Write-Output ("::error title=программы лаб::" + ($bad -join "%0A")) }
          }
          exit $code
      - name: Окна программ (списки, вторая форма, починка сценария после неудачного снимка)
        if: always()
        shell: pwsh
        run: |
          python tools/ci_window_probe.py
          $code = $LASTEXITCODE
          if (Test-Path build/probe/windows.json) {
            $r = Get-Content build/probe/windows.json -Raw -Encoding utf8 | ConvertFrom-Json
            $bad = $r.cases.PSObject.Properties | Where-Object { -not $_.Value.ok } | ForEach-Object { "$($_.Name): $($_.Value.reason)$($_.Value.error)" }
            if ($bad) { Write-Output ("::error title=окна программ::" + ($bad -join "%0A")) }
          }
          exit $code
      - name: Несколько программ в лабе (библиотека, приложение с формой, консоль — один .sln, снимки каждой)
        if: always()
        shell: pwsh
        run: |
          python tools/ci_programs_probe.py
          $code = $LASTEXITCODE
          if (Test-Path build/probe/programs.json) {
            $r = Get-Content build/probe/programs.json -Raw -Encoding utf8 | ConvertFrom-Json
            $bad = $r.cases.PSObject.Properties | Where-Object { -not $_.Value.ok } | ForEach-Object { "$($_.Name): $($_.Value.error)" }
            if ($bad) { Write-Output ("::error title=несколько программ::" + ($bad -join "%0A")) }
          }
          exit $code
      - name: Снимки окон при масштабе экрана 125 %, как на ноутбуках
        if: always()
        shell: pwsh
        run: python tools/ci_dpi_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-program-shots
          path: build/probe
          retention-days: 14

  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Зависимости и Nuitka
        run: |
          python -m pip install ".[windows]" "nuitka==${{ env.NUITKA_VERSION }}" zstandard ordered-set
          python -m pip uninstall -y forlabs
      - name: Кэш Nuitka
        uses: actions/cache/restore@v4
        with:
          path: ~\AppData\Local\Nuitka
          key: nuitka-${{ env.NUITKA_VERSION }}-${{ hashFiles('pyproject.toml') }}-${{ github.run_id }}
          restore-keys: nuitka-${{ env.NUITKA_VERSION }}-${{ hashFiles('pyproject.toml') }}-
      - name: Правила внутрь программы
        run: python tools/embed_rules.py
      - name: Сборка ForLabs.exe
        shell: pwsh
        run: |
          $ver = python -c "from forlabs.version import __version__ as v; print(v)"
          # pymupdf/mupdf.py — сгенерированная обёртка на 2,6 МБ: в C она не помещается в память компилятора
          # (C1002), поэтому идёт в сборку как есть, а её бинарная часть _mupdf — как модуль
          $mupdf = python -c "import pymupdf, os; print(os.path.join(os.path.dirname(pymupdf.__file__), 'mupdf.py'))"
          python tools/ci_run.py nuitka-app python -m nuitka run_forlabs.py --mode=standalone --assume-yes-for-downloads `
            --output-dir=build --output-filename=ForLabs.exe `
            --windows-console-mode=disable --windows-icon-from-ico=packaging/forlabs.ico `
            --company-name=ForLabs --product-name=ForLabs --file-description=ForLabs `
            --file-version="$ver.0" --product-version="$ver.0" `
            --include-package=forlabs --include-package-data=forlabs `
            --noinclude-data-files="forlabs/rules/*.md" --noinclude-data-files="forlabs/rules/*/*.md" `
            --include-package=uvicorn --include-package=keyring.backends --nofollow-import-to=win32ctypes.tests `
            --include-package-data=pythonnet --include-package-data=clr_loader `
            --include-package-data=pymorphy3_dicts_ru --include-package-data=pymorphy3 `
            --include-package-data=docx `
            --include-module=win32timezone `
            --nofollow-import-to=pymupdf.mupdf --include-module=pymupdf._mupdf `
            --no-deployment-flag=excluded-module-usage `
            --include-data-files="${mupdf}=pymupdf/mupdf.py" `
            --nofollow-import-to=pytest --nofollow-import-to=tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem build -Directory | Select-Object Name
      - name: Сохранить кэш Nuitka (даже если дальше что-то упадёт)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~\AppData\Local\Nuitka
          key: nuitka-${{ env.NUITKA_VERSION }}-${{ hashFiles('pyproject.toml') }}-${{ github.run_id }}
      - name: Нет исходников и файлов правил в сборке
        shell: pwsh
        run: |
          $dist = (Resolve-Path "build/run_forlabs.dist").Path
          # путь внутри папки программы: сама папка сборки на машине GitHub тоже называется …\forlabs\…
          $py = Get-ChildItem $dist -Recurse -Include *.py, *.pyc |
            Where-Object { $_.FullName.Substring($dist.Length + 1) -like "forlabs\*" }
          $rules = Test-Path "$dist/forlabs/rules"
          if ($py -or $rules) {
            $py | ForEach-Object { Write-Output "::error title=leak::$($_.FullName)" }
            if ($rules) { Write-Output "::error title=leak::папка forlabs/rules попала в сборку" }
            exit 1
          }
          $size = (Get-ChildItem $dist -Recurse | Measure-Object Length -Sum).Sum / 1MB
          Write-Output ("ForLabs.dist: {0:N0} МБ" -f $size)
      - name: Самопроверка собранной программы
        shell: pwsh
        run: |
          $env:FORLABS_HOME = "$env:RUNNER_TEMP\forlabs-home"
          $out = "$env:RUNNER_TEMP\selfcheck-dist.txt"
          $p = Start-Process build/run_forlabs.dist/ForLabs.exe -ArgumentList "--selfcheck --offline --out `"$out`"" -Wait -PassThru
          if (Test-Path $out) { Get-Content $out -Encoding utf8 } else { Write-Output "::error title=selfcheck::нет отчёта (код $($p.ExitCode))" }
          if ($p.ExitCode -ne 0) {
            if (Test-Path $out) { Write-Output ("::error title=selfcheck dist::" + ((Get-Content $out -Encoding utf8) -join "%0A")) }
            $log = "$env:FORLABS_HOME\forlabs.log"
            if (Test-Path $log) { Write-Output ("::error title=forlabs.log::" + ((Get-Content $log -Tail 30 -Encoding utf8) -join "%0A")) }
            $files = Get-ChildItem build/run_forlabs.dist/pymupdf -ErrorAction SilentlyContinue | ForEach-Object { "$($_.Name) $($_.Length)" }
            Write-Output ("::error title=dist pymupdf::" + ($files -join "%0A"))
            $dlls = Get-ChildItem build/run_forlabs.dist -Filter *mupdf* -Recurse -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName.Substring((Resolve-Path build/run_forlabs.dist).Path.Length) }
            Write-Output ("::error title=dist mupdf files::" + ($dlls -join "%0A"))
            exit 1
          }
      - name: Установщик ForLabsSetup.exe
        shell: pwsh
        run: |
          python tools/make_payload.py build/run_forlabs.dist build/payload.zip
          Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile build/MicrosoftEdgeWebview2Setup.exe
          $ver = python -c "from forlabs.version import __version__ as v; print(v)"
          python tools/ci_run.py nuitka-setup python -m nuitka run_setup.py --mode=onefile --assume-yes-for-downloads `
            --output-dir=build --output-filename=ForLabsSetup.exe `
            --windows-console-mode=disable --windows-icon-from-ico=packaging/forlabs.ico `
            --company-name=ForLabs --product-name="Установка ForLabs" --file-description="Установка ForLabs" `
            --file-version="$ver.0" --product-version="$ver.0" `
            --include-package=forlabs.installer --include-package-data=forlabs.installer `
            --nofollow-import-to=forlabs.cloud --nofollow-import-to=forlabs.core.settings `
            --nofollow-import-to=forlabs.core.instance --nofollow-import-to=keyring `
            --include-package-data=pythonnet --include-package-data=clr_loader `
            --include-data-files=build/payload.zip=payload.zip `
            --include-data-files=build/MicrosoftEdgeWebview2Setup.exe=MicrosoftEdgeWebview2Setup.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output ("ForLabsSetup.exe: {0:N0} МБ" -f ((Get-Item build/ForLabsSetup.exe).Length / 1MB))
          # latest.json — по нему установленные ForLabs узнают о новой версии и сверяют скачанный установщик
          $sha = (Get-FileHash build/ForLabsSetup.exe -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item build/ForLabsSetup.exe).Length
          $url = "https://github.com/${{ github.repository }}/releases/download/v$ver/ForLabsSetup.exe"
          @{ version = $ver; size = $size; sha256 = $sha; url = $url } | ConvertTo-Json | Set-Content build/latest.json -Encoding utf8NoBOM
          Get-Content build/latest.json
      - name: Установка, проверка, удаление (как у студента)
        shell: pwsh
        run: |
          $env:FORLABS_HOME = "$env:RUNNER_TEMP\forlabs-home"
          $target = "$env:RUNNER_TEMP\Программы студента\ForLabs"
          $log = "$env:RUNNER_TEMP\setup.log"
          function Fail($title, $file) {
            if ($file -and (Test-Path $file)) { Write-Output ("::error title=$title::" + ((Get-Content $file -Encoding utf8) -join "%0A")) }
            else { Write-Output "::error title=$title::$file" }
            $slog = "$env:TEMP\ForLabsSetup.log"
            if (Test-Path $slog) { Write-Output ("::error title=ForLabsSetup.log::" + ((Get-Content $slog -Tail 40 -Encoding utf8) -join "%0A")) }
            exit 1
          }
          $p = Start-Process build/ForLabsSetup.exe -ArgumentList "--silent --target `"$target`" --log `"$log`"" -Wait -PassThru
          if (Test-Path $log) { Get-Content $log -Encoding utf8 }
          if ($p.ExitCode -ne 0) { Fail "setup" $log }
          if (-not (Test-Path "$target\ForLabs.exe")) { Fail "setup" "нет ForLabs.exe в $target" }
          $entry = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\ForLabs" -ErrorAction SilentlyContinue
          if (-not $entry -or $entry.InstallLocation -ne $target) { Fail "registry" "нет строки в «Приложениях»" }
          Write-Output "UninstallString: $($entry.UninstallString)"
          $lnk = Join-Path ([Environment]::GetFolderPath("Programs")) "ForLabs.lnk"
          if (-not (Test-Path $lnk)) { Write-Output "::error title=shortcut::нет ярлыка $lnk"; Fail "setup.log" $log }
          $out = "$env:RUNNER_TEMP\selfcheck-installed.txt"
          $p = Start-Process "$target\ForLabs.exe" -ArgumentList "--selfcheck --offline --out `"$out`"" -Wait -PassThru
          if (Test-Path $out) { Get-Content $out -Encoding utf8 }
          if ($p.ExitCode -ne 0) { Fail "selfcheck installed" $out }
          # повторная установка поверх (обновление)
          $p = Start-Process build/ForLabsSetup.exe -ArgumentList "--silent --log `"$log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Fail "update" $log }
          # обновление из приложения, как у студента: ForLabs запущен из своей папки (так его открывает ярлык),
          # установщик стартует из ForLabs и наследует эту папку как рабочую, ждёт, пока ForLabs закроется, и ставит
          $app = Start-Process "$target\ForLabs.exe" -ArgumentList "--browser" -WorkingDirectory $target -PassThru
          Start-Sleep -Seconds 10
          if ($app.HasExited) { Fail "update-from-app" "ForLabs --browser закрылся сам (код $($app.ExitCode))" }
          Remove-Item $log -ErrorAction SilentlyContinue
          Copy-Item build/ForLabsSetup.exe "$env:RUNNER_TEMP\ForLabsSetup-update.exe"
          $setup = Start-Process "$env:RUNNER_TEMP\ForLabsSetup-update.exe" -ArgumentList "--silent --update --wait-pid $($app.Id) --log `"$log`"" -WorkingDirectory $target -PassThru
          Start-Sleep -Seconds 6
          if ($setup.HasExited) { Fail "update-from-app" "установщик не дождался закрытия ForLabs (код $($setup.ExitCode))" }
          Stop-Process -Id $app.Id -Force
          if (-not $setup.WaitForExit(150000)) { Fail "update-from-app" "установщик не закончил за 150 с" }
          if ($setup.ExitCode -ne 0) { Fail "update-from-app" $log }
          Get-Content $log -Encoding utf8
          if (Get-ChildItem (Split-Path $target) -Directory -Filter "ForLabs.new*") { Fail "update-from-app" "осталась папка ForLabs.new" }
          $p = Start-Process "$target\ForLabs.exe" -ArgumentList "--selfcheck --offline --out `"$out`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Fail "selfcheck after update" $out }
          Write-Output "Обновление из приложения: установщик из папки программы дождался закрытия ForLabs и поставил новую версию"
          # удаление, как из «Параметры → Приложения»
          $p = Start-Process "$target\ForLabs.exe" -ArgumentList "--uninstall --silent" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Fail "uninstall" "код $($p.ExitCode)" }
          for ($i = 0; $i -lt 60 -and (Test-Path $target); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $target) {
            $left = Get-ChildItem $target -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 25 | ForEach-Object { $_.FullName.Substring($target.Length) }
            Write-Output ("::error title=uninstall left files::" + ($left -join "%0A"))
            $procs = Get-Process | Where-Object { $_.Path -and $_.Path.StartsWith($target) } | ForEach-Object { "$($_.Id) $($_.Path)" }
            Write-Output ("::error title=uninstall processes::" + ($procs -join "%0A"))
            Fail "ForLabsUninstall.log" "$env:TEMP\ForLabsUninstall.log"
          }
          if (Test-Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\ForLabs") { Fail "uninstall" "строка в «Приложениях» осталась" }
          if (Test-Path $lnk) { Fail "uninstall" "ярлык остался" }
          Write-Output "Установка, проверка, обновление и удаление прошли"
      - uses: actions/upload-artifact@v4
        with:
          name: ForLabsSetup
          path: |
            build/ForLabsSetup.exe
            build/latest.json
          retention-days: 14

  # выпуск — только когда прошли и тесты, и сборка с проверкой установки: по тегу v* или при новой версии в main
  release:
    needs: [tests, build]
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ForLabsSetup
          path: build
      - name: Версия для выпуска
        id: ver
        run: |
          ver=$(python3 -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('forlabs/version.py', encoding='utf-8').read())[1])")
          echo "tag=v$ver" >> "$GITHUB_OUTPUT"
          if git ls-remote --tags origin "refs/tags/v$ver" | grep -q .; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
          ls -l build
          grep -q "\"version\": *\"$ver\"" build/latest.json || { echo "::error::latest.json не для версии $ver"; exit 1; }
      - name: Выпуск
        if: startsWith(github.ref, 'refs/tags/v') || steps.ver.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ForLabs ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.ver.outputs.tag }}
          files: |
            build/ForLabsSetup.exe
            build/latest.json
          generate_release_notes: true
